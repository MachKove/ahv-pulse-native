name: Build AHV PULSE EXE + APK
on: [push, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --include=dev
      - run: npx electron --version
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with: {name: AHV-PULSE-Windows-EXE, path: dist/*}
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - run: npm install --include=dev
      - run: npx cap --version
      - run: npx cap init "AHV PULSE" com.ahv.pulse --web-dir=src || true
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug --info
      - uses: actions/upload-artifact@v4
        with: {name: AHV-PULSE-Android-APK, path: android/app/build/outputs/apk/debug/*.apk}
