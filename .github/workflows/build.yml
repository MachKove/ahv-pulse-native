name: Build AHV PULSE EXE + APK
on: [push, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: List files
        run: dir /s /b
      - run: npm install --include=dev
      - run: npx electron --version
      - run: npm run dist
      - name: List dist
        run: dir dist
      - uses: actions/upload-artifact@v4
        with: {name: AHV-PULSE-Windows-EXE, path: dist/*}
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - run: ls -la
      - run: cat package.json
      - run: npm install --include=dev
      - run: npx cap --version || npx @capacitor/cli --version
      - run: npx cap init "AHV PULSE" com.ahv.pulse --web-dir=src || true
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug --info
      - uses: actions/upload-artifact@v4
        with: {name: AHV-PULSE-Android-APK, path: android/app/build/outputs/apk/debug/*.apk}
